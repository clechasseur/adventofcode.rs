name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CI: 1
  READ_ONLY_GITHUB_TOKEN: ${{ secrets.READ_ONLY_GITHUB_TOKEN }}

jobs:
  clippy:
    name: Clippy validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust with clippy
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          components: clippy
          cache: false

      - name: Rust Cache
        # Temporary fork of `Swatinem/rust-cache` with support for caching `cargo binstall`ed binaries
        # Should be switched if this feature is merged in the main action: https://github.com/Swatinem/rust-cache/pull/325
        uses: clechasseur/rust-cache@45dfca100f1e255035d993b3dc7a8c356de54bf8
        with:
          prefix-key: v1.0.0-rust
          cache-on-failure: true

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.17.9
        with:
          version: v1.17.9

      - name: Install cargo-hack
        uses: clechasseur/rs-cargo@v5.0.5
        with:
          command: binstall
          args: -y cargo-hack@0.6.44

      - name: Run clippy
        uses: clechasseur/rs-clippy-check@v6.0.4
        with:
          args: --workspace --all-targets --feature-powerset -- -D warnings
          tool: cargo-hack
          cache-key: v1-clippy

  fmt:
    name: Rustfmt check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust nightly with rustfmt
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: nightly
          components: rustfmt
          cache: false

      - name: Run Rustfmt
        uses: clechasseur/rs-fmt-check@v4.0.4
        with:
          args: --all

  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-15, windows-2025 ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: stable
          cache: false

      - name: Rust Cache
        uses: clechasseur/rust-cache@45dfca100f1e255035d993b3dc7a8c356de54bf8
        with:
          prefix-key: v1.0.0-rust
          cache-on-failure: true

      - name: Setup cargo-binstall
        uses: cargo-bins/cargo-binstall@v1.17.9
        with:
          version: v1.17.9

      - name: Install required tools
        uses: clechasseur/rs-cargo@v5.0.5
        with:
          command: binstall
          args: -y just@1.48.1 cargo-hack@0.6.44
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run checks on feature powerset
        run: just check-powerset

      - name: Run tests
        run: just test
