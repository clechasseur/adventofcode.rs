[package]
name = "aoclp"
version = "0.1.0"
authors = [ "Charles Lechasseur <shiftingbeard@outlook.com>" ]
edition = "2024"

readme = "README.md"
license = "MIT"

homepage = "https://github.com/clechasseur/adventofcode.rs/aoclp#readme"
repository = "https://github.com/clechasseur/adventofcode.rs"
documentation = "https://docs.rs/aoclp/"

description = "Helper library for Advent of Code"

keywords = [ "aoc", "adventofcode", "advent", "helper" ]

include = [ "src/**/*", "tests/**/*", "LICENSE", "README.md" ]

[package.metadata.docs.rs]
all-features = true
targets = [ "x86_64-unknown-linux-gnu" ]
rustc-args = [ "--cfg", "aoclp_docsrs" ]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    "cfg(aoclp_docsrs)",
    "cfg(tarpaulin)",
    "cfg(tarpaulin_include)",
    "cfg(coverage)",
    "cfg(coverage_nightly)",
]

[dependencies]
anyhow = { workspace = true }
itertools = { workspace = true }
num = { workspace = true }
paste = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
strum = { workspace = true, features = ["derive"] }
