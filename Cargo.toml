[workspace]
resolver = "3"
members = ["aoclp", "aoclp_solutions", "codingquest_clp", "codingquest_clp_solutions"]
default-members = ["aoclp_solutions"]

[workspace.dependencies]
# Used by aoclp:
anyhow = "1.0.104"
itertools = "0.15.0"
num = "0.4.3"
paste = "1.0.15"
regex = "1.13.1"
reqwest = "0.13.5"
strum = { version = "0.28.0", features = ["derive"] }

# Others:
bit-vec = "0.10.1"
clap = "4.6.7"
derive-where = "1.7.0"
dotenv = { package = "dotenv-ng", version = "1.0.0" }
fancy-regex = "0.20.0"
primes = "0.4.0"
rayon = "1.12.0"
z3 = { version = "0.22.0", features = ["gh-release"] }
